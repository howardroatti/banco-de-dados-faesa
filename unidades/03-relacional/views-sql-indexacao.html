</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-class="secao" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" class="secao" data-marpit-pagination="3" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--class:secao;--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h1 id="vis%C3%B5es-views">Visões (Views)</h1>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="4" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="o-que-%C3%A9-uma-view">O que é uma View</h2>
<ul>
<li>Uma <strong>tabela virtual</strong> definida por uma <strong>consulta</strong> — não armazena dados próprios (salvo <em>materialized views</em>).</li>
<li>Formas diferentes de <strong>visualizar</strong> o mesmo conjunto de dados.</li>
</ul>
<p><strong>Objetivos:</strong></p>
<ul>
<li><strong>Segurança</strong> — expor só colunas/linhas permitidas.</li>
<li><strong>Simplificação</strong> — esconder consultas complexas atrás de um nome.</li>
<li><strong>Reúso</strong> — &quot;armazenar&quot; consultas complexas.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="5" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="estrutura-de-uma-view">Estrutura de uma View</h2>
<p><img src="assets/estrutura-view.svg" alt="center" style="height:400px;" /></p>
<p>A view guarda <strong>só a definição</strong> (no catálogo); os dados continuam nas <strong>tabelas base</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="6" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="definindo-views">Definindo Views</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">VIEW</span> alunos_matriculados <span class="hljs-keyword">AS</span>
<span class="hljs-keyword">SELECT</span> a.matricula, a.nome, o.disciplina
  <span class="hljs-keyword">FROM</span> alunos a
  <span class="hljs-keyword">JOIN</span> alunos_ofertas ao <span class="hljs-keyword">ON</span> ao.aluno  <span class="hljs-operator">=</span> a.matricula
  <span class="hljs-keyword">JOIN</span> ofertas        o  <span class="hljs-keyword">ON</span> o.codigo   <span class="hljs-operator">=</span> ao.oferta;
</code></pre>
<p>Operações comuns na definição: <code>WHERE</code> (filtrar linhas), escolher <strong>colunas</strong>, <code>GROUP BY</code> (sumarizar), <code>JOIN</code> (múltiplas tabelas).</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="7" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="views-atualiz%C3%A1veis">Views atualizáveis</h2>
<p>Uma view é <strong>atualizável</strong> (aceita <code>INSERT/UPDATE/DELETE</code>) quando, em geral:</p>
<ul>
<li>Deriva de <strong>uma única</strong> tabela/consulta;</li>
<li>Inclui as <strong>chaves primárias</strong> e as colunas <strong>não nulas</strong> obrigatórias;</li>
<li><strong>Não</strong> usa <code>DISTINCT</code>, <code>GROUP BY</code>, agregações ou remove duplicatas.</li>
</ul>
<div class="aviso">Views com junção/agregação normalmente são <strong>somente leitura</strong> — para alterar dados, use as <strong>tabelas base</strong>.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-class="secao" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" class="secao" data-marpit-pagination="8" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--class:secao;--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h1 id="a-linguagem-sql">A Linguagem SQL</h1>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="9" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="hist%C3%B3ria-e-padr%C3%B5es">História e padrões</h2>
<ul>
<li><strong>SQL</strong> (<em>Structured Query Language</em>): linguagem <strong>declarativa</strong> — você descreve <strong>o que</strong> quer, não <strong>como</strong> obter.</li>
<li>Origem: <strong>SEQUEL</strong> (<em>Structured English Query Language</em>), IBM System R.</li>
<li>Padrões <strong>ANSI/ISO</strong>: SQL-86, SQL-89, <strong>SQL-92 (SQL2)</strong>, SQL:1999, SQL:2003 … SQL:2016/2023.</li>
</ul>
<div class="dica">💡 Os SGBDs não implementam 100% do padrão e ainda acrescentam extensões próprias — daí as diferenças entre Oracle, PostgreSQL e MySQL.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="10" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="os-quatro-grupos-da-sql">Os quatro grupos da SQL</h2>
<table>
<thead>
<tr>
<th>Grupo</th>
<th>Para quê</th>
<th>Comandos</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>DDL</strong> — <em>Definition</em></td>
<td>estrutura</td>
<td><code>CREATE</code>, <code>ALTER</code>, <code>DROP</code></td>
</tr>
<tr>
<td><strong>DML</strong> — <em>Manipulation</em></td>
<td>dados</td>
<td><code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code></td>
</tr>
<tr>
<td><strong>DQL</strong> — <em>Query</em></td>
<td>consulta</td>
<td><code>SELECT</code></td>
</tr>
<tr>
<td><strong>DCL</strong> — <em>Control</em></td>
<td>permissões</td>
<td><code>GRANT</code>, <code>REVOKE</code></td>
</tr>
</tbody>
</table>
<p><em>(alguns autores incluem TCL — <code>COMMIT</code>, <code>ROLLBACK</code>, <code>SAVEPOINT</code>.)</em></p>
<div class="vm">🖥️ A prática completa de DDL/DML/DQL está no <strong>Roteiro Prático de SQL</strong> (Unidade 5), na VM.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-class="secao" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" class="secao" data-marpit-pagination="11" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--class:secao;--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h1 id="indexa%C3%A7%C3%A3o">Indexação</h1>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="12" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="%C3%ADndices">Índices</h2>
<blockquote>
<p>Estrutura <strong>adicional</strong> associada a uma tabela para <strong>acelerar consultas</strong> — como o índice remissivo de um livro.</p>
</blockquote>
<ul>
<li><strong>Vantagem:</strong> buscas muito mais rápidas (evita varredura completa).</li>
<li><strong>Custo:</strong> ocupa espaço e <strong>torna escritas</strong> (<code>INSERT/UPDATE/DELETE</code>) um pouco mais lentas (o índice também é mantido).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> INDEX alunos_nome_idx <span class="hljs-keyword">ON</span> alunos(nome);
</code></pre>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="13" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="%C3%ADndices-ordenados-esparso-%C3%97-denso">Índices Ordenados: esparso × denso</h2>
<ul>
<li><strong>Denso:</strong> uma entrada de índice para <strong>cada</strong> valor de chave da tabela.</li>
<li><strong>Esparso:</strong> uma entrada apenas para <strong>alguns</strong> valores (ex.: um por bloco) — menor, mas exige leitura sequencial a partir da entrada.</li>
</ul>
<table>
<thead>
<tr>
<th>Tipo</th>
<th>Entradas</th>
<th>Tamanho</th>
<th>Busca</th>
</tr>
</thead>
<tbody>
<tr>
<td>Denso</td>
<td>todas as chaves</td>
<td>maior</td>
<td>direta</td>
</tr>
<tr>
<td>Esparso</td>
<td>algumas chaves</td>
<td>menor</td>
<td>aproxima + varre</td>
</tr>
</tbody>
</table>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="14" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="%C3%ADndices-multin%C3%ADveis">Índices Multiníveis</h2>
<ul>
<li>Se o próprio índice fica <strong>grande demais</strong> para varrer rápido, cria-se um <strong>índice sobre o índice</strong>.</li>
<li>O nível de cima (esparso) aponta para <strong>blocos</strong> do nível de baixo → forma uma <strong>árvore</strong> de níveis.</li>
<li>Reduz a busca de <strong>linear</strong> (varrer o índice) para <strong>logarítmica</strong> — poucos acessos a disco.</li>
</ul>
<div class="dica">💡 É a ideia por trás dos índices <strong>B-tree / B+-tree</strong>, o tipo padrão na maioria dos SGBDs.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="15" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="%C3%ADndices-hash">Índices Hash</h2>
<ul>
<li>Aplicam uma <strong>função hash</strong> à chave para localizar o registro em <strong>tempo praticamente constante</strong>.</li>
<li>Ótimos para busca por <strong>igualdade</strong> (<code>= valor</code>); <strong>ruins</strong> para faixas (<code>BETWEEN</code>, <code>&gt;</code>, <code>ORDER BY</code>).</li>
</ul>
<div class="dica">💡 Regra prática: indexe as colunas usadas em <code>WHERE</code>, <code>JOIN</code> e <code>ORDER BY</code> frequentes — mas não indexe tudo (custo de escrita).</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-class="secao" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" class="secao" data-marpit-pagination="16" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--class:secao;--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h1 id="exerc%C3%ADcios-de-consolida%C3%A7%C3%A3o">Exercícios de Consolidação</h1>
<h3 id="unidade-3--12-quest%C3%B5es-estilo-enade">Unidade 3 · 12 questões estilo ENADE</h3>
<h4 id="modelo-relacional--%C3%A1lgebra--viewssqlindexa%C3%A7%C3%A3o--responda-antes-de-virar-o-slide">Modelo Relacional · Álgebra · Views/SQL/Indexação — responda antes de virar o slide!</h4>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="17" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q1--modelo-relacional-chaves">Q1 — Modelo Relacional: chaves</h2>
<p>A tabela <code>FUNCIONARIO(cpf, matricula, nome, email, id_departamento)</code> tem <code>cpf</code>, <code>matricula</code> e <code>email</code> <strong>únicos e não nulos</strong>, e <code>id_departamento</code> <strong>referencia</strong> <code>DEPARTAMENTO</code>.</p>
<p>Assinale a alternativa correta sobre as chaves.</p>
<p>A) <code>cpf</code>, <code>matricula</code> e <code>email</code> são, cada um, uma <strong>chave candidata</strong>; <code>id_departamento</code> é <strong>chave estrangeira</strong>.<br />
B) Apenas <code>cpf</code> pode ser chave primária; os demais não são candidatos.<br />
C) <code>id_departamento</code> é uma <strong>chave candidata</strong> de <code>FUNCIONARIO</code>.<br />
D) A tabela pode ter <strong>várias chaves primárias</strong> simultaneamente.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="18" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q1--gabarito-a">Q1 — Gabarito: <strong>A</strong></h2>
<p><strong>Por que A:</strong> uma <strong>chave candidata</strong> é um identificador <strong>mínimo, único e não nulo</strong>. <code>cpf</code>, <code>matricula</code> e <code>email</code> cumprem isso — qualquer uma poderia ser a <strong>primária</strong>; as demais viram <strong>alternativas</strong>. <code>id_departamento</code> aponta para outra tabela → <strong>estrangeira</strong>.</p>
<ul>
<li><strong>B</strong> — errada: qualquer candidata pode ser escolhida como primária, não só o <code>cpf</code>.</li>
<li><strong>C</strong> — errada: <code>id_departamento</code> <strong>não</strong> é único nesta tabela (é FK, não candidata).</li>
<li><strong>D</strong> — errada: há <strong>uma única</strong> chave primária por tabela.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="19" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q2--modelo-relacional-integridade-referencial">Q2 — Modelo Relacional: integridade referencial</h2>
<p>Em <code>PEDIDO(id, id_cliente)</code>, com <code>id_cliente</code> referenciando <code>CLIENTE</code>, tenta-se <strong>excluir</strong> um cliente que <strong>ainda possui pedidos</strong>.</p>
<p>Para o banco <strong>impedir</strong> a exclusão e manter a consistência, o conceito/mecanismo aplicável é:</p>
<p>A) Integridade de <strong>domínio</strong>, via <code>CHECK</code>.<br />
B) Integridade <strong>referencial</strong>, com ação <code>ON DELETE RESTRICT</code> / <code>NO ACTION</code>.<br />
C) Integridade de <strong>entidade</strong>, garantida pela PK de <code>PEDIDO</code>.<br />
D) Nenhuma; o SGBD sempre permite excluir.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="20" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q2--gabarito-b">Q2 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> a <strong>integridade referencial</strong> garante que toda FK aponte para uma linha existente; <code>RESTRICT</code>/<code>NO ACTION</code> <strong>bloqueia</strong> a exclusão do cliente enquanto houver pedidos referenciando-o.</p>
<ul>
<li><strong>A</strong> — errada: domínio trata de <strong>valores válidos numa coluna</strong> (tipo/faixa), não do vínculo entre tabelas.</li>
<li><strong>C</strong> — errada: integridade de <strong>entidade</strong> é sobre a PK (não nula/única), não sobre a relação entre <code>PEDIDO</code> e <code>CLIENTE</code>.</li>
<li><strong>D</strong> — errada: o SGBD justamente <strong>impede</strong> exclusões que quebrem a FK.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="21" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q3--modelo-relacional-propriedades-da-rela%C3%A7%C3%A3o">Q3 — Modelo Relacional: propriedades da relação</h2>
<p>Um aluno afirma: <em>&quot;em uma relação, a <strong>ordem das linhas importa</strong> e <strong>pode haver linhas totalmente repetidas</strong>&quot;.</em></p>
<p>Segundo o modelo relacional de <strong>Codd</strong>, a afirmação está:</p>
<p>A) Correta nas duas partes.<br />
B) <strong>Incorreta</strong>: a ordem das tuplas <strong>não</strong> importa e <strong>não</strong> há tuplas totalmente duplicadas.<br />
C) Correta quanto à ordem; incorreta quanto às duplicatas.<br />
D) Incorreta quanto à ordem; correta quanto às duplicatas.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="22" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q3--gabarito-b">Q3 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> uma relação é um <strong>conjunto</strong> de tuplas. Logo, <strong>não há ordem</strong> intrínseca entre as linhas e <strong>não existem tuplas totalmente duplicadas</strong> (a chave primária garante unicidade). Os atributos também são <strong>atômicos</strong> (1FN).</p>
<ul>
<li><strong>A, C, D</strong> — erradas: todas aceitam pelo menos uma das duas ideias falsas (ordem relevante ou duplicatas), que contrariam a definição de relação como conjunto.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="23" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q4--modelo-relacional-integridade-de-entidade">Q4 — Modelo Relacional: integridade de entidade</h2>
<p>Tenta-se <strong>inserir</strong> um produto <strong>sem preencher</strong> a coluna que é <strong>chave primária</strong> (deixando-a <code>NULL</code>).</p>
<p>O que ocorre e por quê?</p>
<p>A) É aceito; a PK pode ser nula se for a única linha.<br />
B) É <strong>rejeitado</strong>: a <strong>integridade de entidade</strong> exige PK <strong>não nula e única</strong>.<br />
C) É aceito; <code>NULL</code> conta como um valor único.<br />
D) É rejeitado por violar a integridade de <strong>domínio</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="24" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q4--gabarito-b">Q4 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> a <strong>integridade de entidade</strong> determina que a <strong>chave primária</strong> nunca seja nula e seja única — sem isso a linha não pode ser identificada.</p>
<ul>
<li><strong>A</strong> e <strong>C</strong> — erradas: PK <strong>nunca</strong> é nula; e <code>NULL</code> <strong>não</strong> é um valor comparável (<code>NULL</code> não é igual a <code>NULL</code>), então não serve para identificar.</li>
<li><strong>D</strong> — errada: a regra ferida é de <strong>entidade</strong> (PK), não de <strong>domínio</strong> (valores válidos de uma coluna comum).</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="25" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q5--%C3%A1lgebra-relacional-sele%C3%A7%C3%A3o-%C3%97-proje%C3%A7%C3%A3o">Q5 — Álgebra Relacional: seleção × projeção</h2>
<p>Em <code>ALUNO(matricula, nome, curso)</code>, deseja-se obter <strong>apenas os nomes</strong> dos alunos do curso <strong>'SI'</strong>.</p>
<p>Qual expressão da álgebra relacional está correta?</p>
<p>A) π<sub>nome</sub>( σ<sub>curso='SI'</sub>( ALUNO ) )<br />
B) σ<sub>nome</sub>( π<sub>curso='SI'</sub>( ALUNO ) )<br />
C) σ<sub>curso='SI'</sub>( ALUNO )<br />
D) π<sub>curso</sub>( σ<sub>nome='SI'</sub>( ALUNO ) )</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="26" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q5--gabarito-a">Q5 — Gabarito: <strong>A</strong></h2>
<p><strong>Por que A:</strong> <strong>σ (seleção)</strong> filtra <strong>linhas</strong> pela condição <code>curso='SI'</code>; <strong>π (projeção)</strong> mantém só a <strong>coluna</strong> <code>nome</code>.</p>
<ul>
<li><strong>B</strong> — errada: troca os operadores — σ precisa de <strong>condição</strong> e π de <strong>lista de colunas</strong>.</li>
<li><strong>C</strong> — errada: filtra certo, mas devolve a <strong>tupla inteira</strong>, não só o <code>nome</code>.</li>
<li><strong>D</strong> — errada: projeta a coluna errada (<code>curso</code>) e filtra pelo campo errado (<code>nome</code>).</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="27" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q6--%C3%A1lgebra-relacional-jun%C3%A7%C3%A3o-natural">Q6 — Álgebra Relacional: junção natural</h2>
<p><code>DEPTO</code> tem <strong>3 linhas</strong> e <code>FUNC</code> tem <strong>7 linhas</strong>, cada funcionário com um <code>id_depto</code> <strong>válido</strong>.</p>
<p>Quantas linhas resultam de <code>DEPTO ⋈ FUNC</code> (junção natural por <code>id_depto</code>)?</p>
<p>A) 21 linhas.<br />
B) 3 linhas.<br />
C) 7 linhas.<br />
D) 10 linhas.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="28" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q6--gabarito-c">Q6 — Gabarito: <strong>C</strong></h2>
<p><strong>Por que C:</strong> cada linha de <code>FUNC</code> casa com <strong>exatamente um</strong> <code>DEPTO</code> (a FK sempre existe). A junção tem, então, o número de linhas do lado <strong>&quot;muitos&quot;</strong> = <strong>7</strong>.</p>
<ul>
<li><strong>A</strong> — errada: 21 = 3 × 7 é o <strong>produto cartesiano</strong>, que a junção <strong>não</strong> faz.</li>
<li><strong>B</strong> — errada: 3 é a quantidade de departamentos.</li>
<li><strong>D</strong> — errada: 10 é a <strong>soma</strong> 3 + 7, sem sentido aqui.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="29" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q7--%C3%A1lgebra-relacional-divis%C3%A3o">Q7 — Álgebra Relacional: divisão</h2>
<p><code>CURSOU(aluno, disciplina)</code> registra o que cada aluno cursou. Deseja-se <strong>os alunos que cursaram TODAS</strong> as disciplinas obrigatórias.</p>
<p>Qual operação expressa isso <strong>naturalmente</strong>?</p>
<p>A) Junção ( ⋈ ).<br />
B) Divisão ( ÷ ).<br />
C) Interseção ( ∩ ).<br />
D) Produto cartesiano ( × ).</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="30" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q7--gabarito-b">Q7 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> a <strong>divisão</strong> responde exatamente à ideia de <em>&quot;quem se relaciona com <strong>TODOS</strong> os valores&quot;</em> de um conjunto divisor (todas as disciplinas obrigatórias).</p>
<ul>
<li><strong>A</strong> — errada: a junção apenas <strong>combina</strong> tabelas, não exige &quot;todos&quot;.</li>
<li><strong>C</strong> — errada: interseção compara <strong>relações compatíveis</strong>, não &quot;aluno × conjunto de disciplinas&quot;.</li>
<li><strong>D</strong> — errada: o produto cartesiano gera <strong>todas as combinações</strong>, sem o critério &quot;todas&quot;.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="31" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q8--%C3%A1lgebra-relacional-opera%C3%A7%C3%B5es-de-conjunto">Q8 — Álgebra Relacional: operações de conjunto</h2>
<p>Deseja-se a <strong>união</strong> de duas relações <code>R</code> e <code>S</code> ( <code>R ∪ S</code> ).</p>
<p>Para essa operação ser <strong>válida</strong>, é necessário que:</p>
<p>A) <code>R</code> e <code>S</code> tenham o <strong>mesmo número de linhas</strong>.<br />
B) <code>R</code> e <code>S</code> sejam <strong>compatíveis</strong>: mesmo número de atributos e <strong>domínios correspondentes</strong>.<br />
C) <code>R</code> e <code>S</code> tenham a <strong>mesma chave primária</strong>.<br />
D) <code>R</code> e <code>S</code> estejam na <strong>mesma tabela física</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="32" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q8--gabarito-b">Q8 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> ∪, ∩ e − exigem <strong>compatibilidade de união</strong>: mesma <strong>quantidade de atributos</strong> e <strong>domínios correspondentes</strong> (colunas na mesma ordem e tipo).</p>
<ul>
<li><strong>A</strong> — errada: o número de <strong>linhas</strong> é irrelevante.</li>
<li><strong>C</strong> — errada: não é preciso mesma PK, e sim mesma <strong>estrutura de colunas</strong>.</li>
<li><strong>D</strong> — errada: são relações; não importa onde estão armazenadas.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="33" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q9--sql-where-%C3%97-having">Q9 — SQL: <code>WHERE</code> × <code>HAVING</code></h2>
<p>Em <code>VENDA(id, vendedor, valor)</code>, o gerente quer os <strong>vendedores cujo total vendido</strong> (∑ <code>valor</code>) <strong>passa de R$ 10.000</strong>.</p>
<p>Qual consulta atende?</p>
<p>A) <code>SELECT vendedor FROM VENDA WHERE SUM(valor)&gt;10000 GROUP BY vendedor</code><br />
B) <code>SELECT vendedor FROM VENDA GROUP BY vendedor HAVING SUM(valor)&gt;10000</code><br />
C) <code>SELECT vendedor FROM VENDA WHERE valor&gt;10000</code><br />
D) <code>SELECT vendedor FROM VENDA GROUP BY vendedor WHERE SUM(valor)&gt;10000</code></p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="34" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q9--gabarito-b">Q9 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> filtro sobre um <strong>agregado por grupo</strong> → <code>GROUP BY</code> + <code>HAVING</code> (que aceita <code>SUM</code>, <code>COUNT</code>…).</p>
<ul>
<li><strong>A</strong> e <strong>D</strong> — erradas: usam <code>SUM</code> no <code>WHERE</code>, que <strong>não aceita agregação</strong> e é avaliado <strong>antes</strong> do agrupamento.</li>
<li><strong>C</strong> — errada: filtra <strong>vendas individuais</strong> acima de 10.000, não o <strong>total</strong> de cada vendedor.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="35" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q10--sql-tipos-de-join">Q10 — SQL: tipos de <code>JOIN</code></h2>
<p>Deseja-se listar <strong>todos os clientes</strong>, <strong>inclusive os que nunca fizeram pedido</strong>, mostrando o número de pedidos (0 para quem não tem).</p>
<p>Qual junção usar?</p>
<p>A) <code>INNER JOIN</code> entre <code>CLIENTE</code> e <code>PEDIDO</code>.<br />
B) <code>LEFT JOIN</code> de <code>CLIENTE</code> com <code>PEDIDO</code>.<br />
C) <code>CROSS JOIN</code> (produto cartesiano).<br />
D) Não é possível em SQL.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="36" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q10--gabarito-b">Q10 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> o <code>LEFT JOIN</code> mantém <strong>todas as linhas da tabela à esquerda</strong> (<code>CLIENTE</code>), mesmo sem correspondência em <code>PEDIDO</code> (vêm <code>NULL</code>/0 do lado direito).</p>
<ul>
<li><strong>A</strong> — errada: o <code>INNER JOIN</code> <strong>descartaria</strong> os clientes sem pedido.</li>
<li><strong>C</strong> — errada: o <code>CROSS JOIN</code> combina <strong>todos com todos</strong>, resultado sem sentido aqui.</li>
<li><strong>D</strong> — errada: é um caso clássico e comum em SQL.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="37" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q11--sql-views">Q11 — SQL: Views</h2>
<p>Um DBA cria uma <strong>VIEW</strong> que junta três tabelas e expõe <strong>apenas algumas colunas</strong> para um relatório.</p>
<p>Assinale a alternativa <strong>correta</strong> sobre views.</p>
<p>A) Uma view <strong>armazena fisicamente</strong> uma cópia dos dados, ocupando o mesmo espaço das tabelas.<br />
B) Uma view é uma <strong>consulta nomeada</strong> (tabela virtual); simplifica o acesso e pode <strong>restringir</strong> colunas/linhas por segurança.<br />
C) Views <strong>não podem</strong> ser consultadas com <code>SELECT</code>.<br />
D) Views <strong>sempre</strong> aceitam <code>INSERT</code>/<code>UPDATE</code> sem restrição.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="38" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q11--gabarito-b">Q11 — Gabarito: <strong>B</strong></h2>
<p><strong>Por que B:</strong> uma view (comum) é uma <strong>consulta guardada</strong> que se comporta como <strong>tabela virtual</strong> — os dados continuam nas tabelas-base. Serve para <strong>abstrair, simplificar e proteger</strong> (mostrar só parte dos dados).</p>
<ul>
<li><strong>A</strong> — errada: quem armazena dados é a <strong>view materializada</strong>; a view comum <strong>não</strong> guarda cópia.</li>
<li><strong>C</strong> — errada: a view é consultada com <code>SELECT</code> normalmente.</li>
<li><strong>D</strong> — errada: views com <strong>junção/agregação</strong> geralmente <strong>não</strong> são atualizáveis.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="39" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q12--indexa%C3%A7%C3%A3o-seletividade">Q12 — Indexação: seletividade</h2>
<p>Numa tabela de <strong>milhões de linhas</strong>, a equipe decide onde criar índices. Em qual coluna o índice <strong>tende a NÃO compensar</strong>?</p>
<p>A) <code>cpf</code> (única), usada em <code>WHERE cpf = ...</code><br />
B) <code>id_cliente</code> (FK) usada em <code>JOIN</code>.<br />
C) coluna <strong>booleana</strong> <code>ativo</code> (S/N) cujo filtro retorna <strong>~metade</strong> das linhas.<br />
D) <code>data</code> usada em faixas (<code>BETWEEN</code>).</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="40" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
<h2 id="q12--gabarito-c">Q12 — Gabarito: <strong>C</strong></h2>
<p><strong>Por que C:</strong> o índice compensa quando a busca é <strong>seletiva</strong> (retorna <strong>poucas</strong> linhas). Uma coluna de <strong>baixa seletividade</strong> (booleana → ~50% das linhas) leva o otimizador a preferir a <strong>varredura completa</strong>; o índice só <strong>onera escrita e espaço</strong>.</p>
<ul>
<li><strong>A</strong> — errada: <code>cpf</code> é <strong>altamente seletivo</strong> (uma linha) → índice excelente.</li>
<li><strong>B</strong> — errada: FK em <code>JOIN</code> é um dos <strong>melhores</strong> casos para indexar.</li>
<li><strong>D</strong> — errada: faixas de <code>data</code> se beneficiam de índices ordenados (B-tree).</li>
</ul>
<div class="dica">💡 <strong>Gabarito geral:</strong> 1A · 2B · 3B · 4B · 5A · 6C · 7B · 8B · 9B · 10B · 11B · 12C</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · <a href="../../index.html">☰ Sumário</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html)" data-theme="r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp" lang="pt-BR" data-marpit-pagination="41" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Banco de Dados · 2026/2 · [☰ Sumário](../../index.html);--theme:r51fgo8qzpofk0b0r0444suhrhboq2shkgldud3yqcp;" data-marpit-pagination-total="42">
