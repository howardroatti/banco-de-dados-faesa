<svg aria-roledescription="pie" role="graphics-document document" style="max-width: 779.453px; background-color: transparent;" viewBox="0 0 779.453125 450" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="100%" id="my-svg"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#666;stroke:#666;}#my-svg .marker.cross{stroke:#666;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#000000;font-size:17px;}#my-svg .legend text{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle class="pieOuterCircle" r="186" cy="0" cx="0"/><path class="pieCircle" fill="#F4F4F4" d="M0,-185A185,185,0,1,1,-175.945,-57.168L0,0Z"/><path class="pieCircle" fill="#555" d="M-175.945,-57.168A185,185,0,0,1,0,-185L0,0Z"/><text style="text-anchor: middle;" class="slice" transform="translate(81.55520375558065,112.25110796952396)">80%</text><text style="text-anchor: middle;" class="slice" transform="translate(-81.55520375558066,-112.25110796952394)">20%</text><text class="pieTitleText" y="-200" x="0">Dados gerados no mundo (estimativa)</text><g transform="translate(216,-22)" class="legend"><rect style="fill: rgb(244, 244, 244); stroke: rgb(244, 244, 244);" height="18" width="18"/><text y="14" x="22">Não estruturado [80]</text></g><g transform="translate(216,0)" class="legend"><rect style="fill: rgb(85, 85, 85); stroke: rgb(85, 85, 85);" height="18" width="18"/><text y="14" x="22">Estruturado / semiestruturado [20]</text></g></g></svg>